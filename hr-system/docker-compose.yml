services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: rahmania_hr
    volumes:
      - hr_db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hr_user -d rahmania_hr']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hr_user:hr_password@db:5432/rahmania_hr?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ZKTECO_IP: ${ZKTECO_IP:-}
      ZKTECO_PORT: ${ZKTECO_PORT:-4370}
      ZKTECO_INPORT: ${ZKTECO_INPORT:-4000}
      ZKTECO_TIMEOUT_MS: ${ZKTECO_TIMEOUT_MS:-10000}
      UPLOAD_DIR: uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@rahmania.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - hr_uploads:/app/uploads
    ports:
      - '4000:4000'
    # If the ZKTeco terminal is on the office LAN and this stack runs on
    # the same host machine, "network_mode: host" is often simpler than
    # port-mapping UDP/TCP discovery traffic - uncomment if needed:
    # network_mode: host

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'

volumes:
  hr_db_data:
  hr_uploads:
